# The full quality gate from CONTRIBUTING.md, on every push and pull
# request: formatting, file length, both test profiles, pedantic clippy,
# and warning-free documentation — on Linux and macOS, at the stable and
# minimum supported Rust versions. Windows builds are checked but not tested:
# the writable store requires an operating system entropy source that
# froe only reads on Unix, so writer tests cannot pass there yet.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      - run: rustup default ${{ matrix.rust }}
      # Caches built dependencies keyed by lockfile and toolchain; the
      # shared key lets the release workflow's ubuntu/stable jobs restore
      # the cache this job saves on develop (the default branch).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}-${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      # clippy has no file-length lint, so the thousand-line rule in
      # CONTRIBUTING.md is enforced by a script rather than by the compiler.
      - run: scripts/oversized-files.sh
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89 --profile minimal --component clippy
      - run: rustup default 1.89
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-1.89
      - run: cargo check --workspace --all-targets
