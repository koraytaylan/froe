# Tag-driven releases: pushing a tag `vX.Y.Z` verifies the tag matches
# the workspace version, that the full ci.yml gate passes on the tagged
# commit — on Linux and macOS, at stable and the minimum supported Rust
# version — and that the Oak interoperability suite passes against the
# pinned Sling image, because the release notes assert that maintenance is
# verified against a named Oak build. Then it generates the changelog from
# the conventional-commit history with git-cliff, builds the CLI for the
# most compatible target of each platform (static musl on Linux, Apple
# silicon on macOS, MSVC on Windows — where the read-only commands
# work and the maintenance commands refuse), publishes a GitHub release
# with the binaries and checksums, and then publishes the crates to
# crates.io (docs.rs builds documentation automatically from there).
# Every step converges on re-runs, so a partially failed release can be
# finished by pushing the tag again.
#
# Requires one repository secret: CARGO_REGISTRY_TOKEN, a crates.io API
# token with publish scope.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and first, so a mistyped tag fails before the matrix below
  # occupies four runners.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi

  # Deliberately the same command set and matrix as ci.yml's gate, run
  # against the tagged commit. A Linux-only verification could publish a
  # release whose macOS half never ran: nothing else between the branch
  # gate and crates.io re-checks the other platform, and the maintenance
  # commands are Unix-specific, so macOS is a first-class target rather
  # than an afterthought. Keep this in step with ci.yml.
  verify:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.89"]
    runs-on: ${{ matrix.os }}
    # Job-scoped rather than workflow-wide: the binary builds below must
    # not compile their dependencies with warnings denied.
    env:
      RUSTFLAGS: --deny warnings
      RUSTDOCFLAGS: --deny warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      - run: rustup default ${{ matrix.rust }}
      # Restores the dependency cache CI saves on develop for this same
      # runner/toolchain pair; tag runs can read default-branch caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-${{ matrix.os }}-${{ matrix.rust }}
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps

  # The release notes assert that maintenance is verified against a named Oak
  # build. Publishing that claim without running the suite would make it an
  # assertion about a run that happened at some earlier commit, so the release
  # proves it here, against the digest pinned in the test source.
  interop:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Run the interop suite
        run: scripts/interop-fixture.sh
        env:
          FROE_INTEROP_WORK_ROOT: /tmp/interop-work
      # Attached to the release below, so the published artifacts carry the
      # evidence for the claim in their own notes.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interop-run-record
          path: /tmp/interop-work/interop-run-record.txt
          if-no-files-found: warn

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Prebuilt binary — compiling git-cliff from source with
      # `cargo install` took several minutes per release.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate the full changelog and this release's notes
        run: |
          git-cliff --output CHANGELOG.md
          git-cliff --latest --strip header --output RELEASE_NOTES.md
          {
            echo ""
            echo "### Platform notes"
            echo ""
            echo "- Linux binaries are statically linked (musl) and run on any distribution."
            echo "- The Windows binary supports the read-only commands; maintenance"
            echo "  commands refuse to run there (a Unix entropy source is required)."
            echo "- Maintenance is verified against Apache Jackrabbit Oak"
            echo "  oak-segment-tar 1.90.0 by the interoperability suite; store.version=1"
            echo "  stores, external blob stores and Adobe AEM itself are not yet covered."
            echo "  Stop the repository first, and copy irreplaceable data before"
            echo "  destructive operations."
            echo "- \`sha256sum --check SHA256SUMS\` verifies any downloaded archive."
          } >> RELEASE_NOTES.md
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            container: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    # The musl entries run inside the rust-musl-cross image, which ships
    # musl-gcc and the target's std preinstalled; the macOS and Windows
    # entries have no container set, so they run directly on the runner.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add ${{ matrix.target }}
      # Warms same-tag re-runs; first runs per target stay cold builds
      # because nothing on the default branch compiles these targets.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --release -p froe-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="froe-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/froe.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/froe" "$name/"
          fi
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            froe-*.tar.gz
            froe-*.zip

  release:
    needs: [verify, interop, changelog, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum froe-*.tar.gz froe-*.zip > SHA256SUMS
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A re-run after a partial release must refresh the existing
        # release rather than die on the duplicate.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "froe $GITHUB_REF_NAME" \
              --notes-file artifacts/RELEASE_NOTES.md
            gh release upload "$GITHUB_REF_NAME" --clobber \
              artifacts/froe-*.tar.gz \
              artifacts/froe-*.zip \
              artifacts/SHA256SUMS \
              artifacts/CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "froe $GITHUB_REF_NAME" \
              --notes-file artifacts/RELEASE_NOTES.md \
              artifacts/froe-*.tar.gz \
              artifacts/froe-*.zip \
              artifacts/SHA256SUMS \
              artifacts/CHANGELOG.md
          fi

  publish-crates:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-ubuntu-latest-stable
          save-if: false
      # In dependency order; cargo waits until each publish is visible
      # in the index before returning, so downstream version
      # dependencies resolve. Versions already in the index are skipped,
      # so a re-run after a partial publish converges instead of dying
      # on the duplicate. docs.rs builds documentation automatically
      # once a publish lands — no separate step needed.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          for crate in froe froe-export froe-cli; do
            # Existence is checked against the sparse index — the same
            # source cargo reads — because the crates.io API rejects
            # requests without a browser-like User-Agent. The index path
            # for names of four or more characters is
            # <first two>/<next two>/<name>.
            index_url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            if curl --silent --fail "$index_url" | grep --quiet "\"vers\":\"${version}\""; then
              echo "${crate} ${version} is already on crates.io; skipping"
            else
              cargo publish -p "$crate"
            fi
          done

  # Advance `main` to the released commit, so "main is the latest released
  # state" is a property this pipeline maintains rather than a habit someone
  # has to remember. It drifted to v0.1.0 once before, and a branch advertised
  # as tracking releases that quietly lags is worse than one honestly labelled
  # historical: it looks authoritative while being stale.
  #
  # Last, and dependent on the publish, so main only ever names a commit whose
  # crates actually reached the registry. The push is a fast-forward: main
  # carries no commits of its own, and --ff-only makes a divergence fail loudly
  # here instead of being resolved by a merge nobody reviewed.
  advance-main:
    needs: publish-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward main to the release commit
        run: |
          released="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$released"; then
            echo "main ($(git rev-parse --short origin/main)) is not an ancestor of" \
                 "$GITHUB_REF_NAME ($(git rev-parse --short "$released")); it has" \
                 "commits of its own, so advancing it is not a fast-forward." \
                 "Reconcile deliberately rather than letting this job merge." >&2
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" = "$released" ]; then
            echo "main is already at $GITHUB_REF_NAME; nothing to do."
            exit 0
          fi
          git push origin "$released:refs/heads/main"
