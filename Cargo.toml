[workspace]
members = ["crates/froe", "crates/froe-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Koray Taylan Davgana <koraytaylan@gmail.com>"]
keywords = ["jackrabbit", "oak", "tarmk", "aem", "segment"]
categories = ["filesystem", "parser-implementations", "command-line-utilities"]

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Casting between integer widths is inherent to binary format parsing; every cast
# in this workspace is bounds-checked or provably lossless at its use site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
