[package]
name = "froe-cli"
description = "Command line for Apache Jackrabbit Oak segment-tar (TarMK) repositories: inspect and export read-only; clean, compact, back up, and recover offline."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]

[[bin]]
name = "froe"
path = "src/main.rs"
# The binary shares its name with the library crate; documentation for the
# workspace is the library's (cargo would otherwise report a filename
# collision at target/doc/froe).
doc = false

[dependencies]
froe = { version = "0.10.0", path = "../froe" }
froe-export = { version = "0.10.0", path = "../froe-export", features = ["parquet", "sqlite"] }
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Restores default SIGPIPE handling so piping into `head` and friends
# ends the process quietly instead of panicking on a closed pipe.
# Already in the dependency graph through memmap2.
libc = "0.2"

[features]
# End-to-end interop tests against a real Apache Sling / Jackrabbit Oak
# TarMK store. Gated because they require podman and the apache/sling:14
# image. Run with: cargo test -p froe-cli --features interop -- --ignored
interop = []

[lints]
workspace = true
