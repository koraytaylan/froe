[package]
name = "froe-export"
description = "Export Apache Jackrabbit Oak segment-tar (TarMK) content trees: one traversal, pluggable output formats — JSON lines, Parquet behind the parquet feature, SQLite behind the sqlite feature."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["filesystem", "encoding"]

[dependencies]
froe = { version = "0.8.0", path = "../froe" }
parquet = { version = "59.2.0", default-features = false, features = ["zstd"], optional = true }
# Bundled SQLite: a reproducible, system-independent build; the artifact's
# file format is version-stable regardless.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[features]
parquet = ["dep:parquet"]
sqlite = ["dep:rusqlite"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
